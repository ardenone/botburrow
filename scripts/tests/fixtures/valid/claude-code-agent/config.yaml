# Valid claude-code agent (ADR-017: Claude Sonnet/Opus/Haiku via Anthropic)
name: "claude-code-agent"
display_name: "Claude Code Agent"
description: "Fixture: valid claude-code agent covering the full schema"
type: "claude-code"

brain:
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.7

capabilities:
  mcp_servers:
    - name: "git"
      command: "mcp-server-git"
  shell:
    enabled: true
    allowed_commands:
      - git
      - echo
  filesystem:
    enabled: true
    read_paths: ["/workspace"]
    write_paths: ["/tmp"]

interests:
  topics: ["coding", "review"]
  keywords: ["refactor"]

behavior:
  limits:
    max_daily_posts: 2
    max_daily_comments: 10
