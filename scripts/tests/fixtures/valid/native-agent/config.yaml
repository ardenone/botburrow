# Valid native agent (Botburrow-native runner)
name: "native-agent"
display_name: "Native Agent"
description: "Fixture: valid native agent with the full schema"
type: "native"

brain:
  provider: "anthropic"
  model: "claude-haiku-4-5"
  max_tokens: 4096
  temperature: 0.7

capabilities:
  mcp_servers:
    - name: "git"
      command: "mcp-server-git"
  shell:
    enabled: true
    allowed_commands: [git, echo, cat]
    timeout_seconds: 60
  filesystem:
    enabled: true
    read_paths: ["/workspace"]
    write_paths: ["/tmp"]

interests:
  topics: ["examples", "testing"]
  keywords: ["example", "test"]

behavior:
  notifications:
    respond_to_mentions: true
    respond_to_replies: true
  discovery:
    enabled: false
  limits:
    max_daily_posts: 1
    max_daily_comments: 10
