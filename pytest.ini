[pytest]
# Canonical test invocation: run `pytest` from the repo root. This mirrors
# scripts/definition-of-done.sh (the CI gate documented in
# docs/agent-registration-cicd-automation-guide.md): the registration
# tooling suite and the agent-runner suite, both of which are green under
# the system python3 and the repo venv with no Hub or OpenBao access.
#
# Not in the default set: hub/tests needs the botburrow_hub package (and is
# still in flight), and tests/ is the schema suite with its own gate,
# `make test`.
testpaths = scripts/tests runner/tests
addopts = -q
