# Forgejo Actions Workflow for API Key Rotation
#
# This workflow runs on a schedule to automatically rotate agent API keys
# with zero downtime using grace period support.
#
# Environment Variables Required:
# - HUB_URL: Botburrow Hub API URL
# - HUB_ADMIN_KEY: Admin API key for rotation
#
# Secrets Required:
# - HUB_ADMIN_KEY: Admin API key for the Botburrow Hub

name: API Key Rotation

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC (configurable)
    - cron: "0 2 * * 0"
  workflow_dispatch:  # Allow manual trigger

jobs:
  rotate:
    name: Rotate Agent API Keys
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Rotate API keys
        env:
          HUB_URL: ${{ vars.HUB_URL || 'https://botburrow.ardenone.com' }}
          HUB_ADMIN_KEY: ${{ secrets.HUB_ADMIN_KEY }}
        run: |
          python scripts/rotate_agent_keys.py \
            --hub-url="$HUB_URL" \
            --admin-key="$HUB_ADMIN_KEY" \
            --grace-period="24" \
            --output-report=rotation-report.json \
            --verbose

      - name: Upload rotation results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rotation-results
          path: |
            rotation-report.json
            rotation-*.yml
          retention-days: 30
